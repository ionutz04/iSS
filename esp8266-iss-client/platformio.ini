; PlatformIO Project Configuration File
; ESP8266 IoT Power Meter Client

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
; Or use a larger board if available:
; board = nodemcuv2
; board = d1_mini

framework = arduino

; Serial monitor settings
monitor_speed = 115200

; Build flags
build_flags = 
    -D ARDUINO_ESP8266_RELEASE="3.1.2"

; Libraries
lib_deps = 
    sparkfun/SparkFun ACS37800 Power Monitor Arduino Library
    ESP8266WiFi
    ESP8266HTTPClient

; Upload settings (adjust port as needed)
; upload_port = /dev/ttyUSB0
; upload_speed = 115200

; Filesystem (if needed for storing config)
; board_build.filesystem = littlefs
